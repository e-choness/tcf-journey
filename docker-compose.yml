services:
  jekyll:
    build: .
    container_name: tcf-journey
    volumes:
      - .:/site
      - /site/.bundle
      - /site/_site
    ports:
      - "4000:4000"
    environment:
      - JEKYLL_ENV=development
    command: bundle exec jekyll serve --host 0.0.0.0 --config _config/_config_dev.yml --livereload
