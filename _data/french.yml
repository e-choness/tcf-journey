# /french — flip cards. Front = French term, back = meaning + gender + example.
categories:
  - { id: grammar,     en: Grammar,     fr: Grammaire }
  - { id: vocabulary,  en: Vocabulary,  fr: Vocabulaire }
  - { id: conjugation, en: Conjugation, fr: Conjugaison }
  - { id: expression,  en: Expression,  fr: Expression }

levels: [A1, A2, B1, B2, C1]

# Cards can live here directly rather than as posts.
cards:
  - term: "le déménagement"
    category: vocabulary
    gender: "nom masculin"
    level: B1
    hint: logement
    meaning: "Moving house — the act of changing home"
    example: "Le déménagement est prévu pour samedi matin."
    example_en: "The move is set for Saturday morning."
  - term: "quoique"
    category: grammar
    gender: conjonction
    level: B2
    hint: "+ subjonctif"
    meaning: "Although — takes the subjunctive"
    example: "Quoiqu'il soit fatigué, il continue."
    example_en: "Although he's tired, he keeps going."
