---
layout: default
---

<article class="post-page">
  <div class="post-container">
    <a href="{{ '/blog' | relative_url }}" class="back-link">← Back to journal</a>

    <div class="post-header">
      <h1 class="post-title">{{ page.title }}</h1>

      <div class="post-meta">
        <span class="post-date">{{ page.date | date: "%d %b %Y" }}</span>
        <span class="post-reading-time" id="post-reading-time">— min read</span>
      </div>
    </div>

    {% if page.description %}
    <p class="post-lead">{{ page.description }}</p>
    {% endif %}

    {% if page.image %}
    <div class="post-image" style="--post-image: url('{{ page.image }}');"></div>
    {% else %}
    <div class="post-image wob"></div>
    {% endif %}

    <div class="post-content">
      {{ content }}
    </div>

    <div class="post-footer">
      <button class="post-next-btn" id="next-post-btn">Next post →</button>
    </div>
  </div>
</article>

<div class="post-data" data-blog-url="{{ '/blog/' | relative_url }}"></div>
