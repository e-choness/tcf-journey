---
layout: default
---

<article class="drill-page">
  <div class="drill-container">
    <a href="{{ '/tcf' | relative_url }}" class="back-link"
       data-i18n-en="{{ site.data.i18n.en.drill.back }}" data-i18n-fr="{{ site.data.i18n.fr.drill.back }}">← {{ site.data.i18n.en.drill.back }}</a>

    <div class="drill-header">
      <div class="drill-tags-row">
        <span class="tag tag-section">{{ page.section | upcase }}</span>
        <span class="tag tag-neutral">{{ page.tache }}</span>
        <span class="tag tag-neutral">{{ page.level }}</span>
        <span class="tag tag-neutral">{{ page.topic }}</span>
      </div>

      <h1 class="drill-title">{{ page.title }}</h1>

      <div class="drill-meta">
        <span class="drill-date">{{ page.date | date: "%d %b %Y" }}</span>
        <span class="drill-reading-time" id="drill-reading-time">— min read</span>
      </div>
    </div>

    {% if page.brief %}
    <div class="drill-brief">
      <div class="tape hand"></div>
      <div class="brief-label hand">Brief</div>
      <div class="brief-content wob2">
        {{ page.brief }}
      </div>
    </div>
    {% endif %}

    <div class="drill-content">
      {{ content }}
    </div>

    <div class="drill-footer">
      <button class="drill-done-btn-large" data-drill-id="{{ page.url | relative_url }}" id="drill-done-btn" aria-pressed="false"
              data-i18n-en="{{ site.data.i18n.en.drill.mark_done }}" data-i18n-fr="{{ site.data.i18n.fr.drill.mark_done }}"
              data-i18n-marked-en="{{ site.data.i18n.en.drill.marked_done }}" data-i18n-marked-fr="{{ site.data.i18n.fr.drill.marked_done }}">
        <span class="done-text">{{ site.data.i18n.en.drill.mark_done }}</span>
        <span class="done-check">✓ {{ site.data.i18n.en.drill.marked_done }}</span>
      </button>
      <button class="drill-next-btn" id="next-drill-btn"
              data-i18n-en="{{ site.data.i18n.en.drill.next }}" data-i18n-fr="{{ site.data.i18n.fr.drill.next }}">{{ site.data.i18n.en.drill.next }} →</button>
    </div>
  </div>
</article>

<div class="drill-data" data-drill-id="{{ page.url | relative_url }}" data-tcf-url="{{ '/tcf/' | relative_url }}"></div>
