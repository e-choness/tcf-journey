<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    {% seo %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Inter:wght@400;500;600&family=Patrick+Hand&display=swap">

    <script>
    (function () {
      try {
        var l = localStorage.getItem('tcf-journey-lang');
        if (l !== 'en' && l !== 'fr') l = (navigator.language||'en').toLowerCase().indexOf('fr')===0 ? 'fr' : 'en';
        var t = localStorage.getItem('tcf-journey-theme') || 'dark';
        document.documentElement.setAttribute('data-lang', l);
        document.documentElement.setAttribute('lang', l);
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
    </script>

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
</head>
<body>
    <div class="paper">
        <!-- Cursor spotlight -->
        <div id="spotlight"></div>

        <!-- Punch holes decoration -->
        <div class="d-only punch punch-1"></div>
        <div class="d-only punch punch-2"></div>
        <div class="d-only punch punch-3"></div>

        <div class="main-wrapper">
            {% include header.html %}

            <main class="main-content">
                {{ content }}
            </main>

            {% include footer.html %}
        </div>
    </div>

    <script src="{{ '/assets/js/progress.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/dark-mode.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/navbar.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/tcf-drills.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/french-cards.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/drill-page.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/post-page.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/blog-list.js' | relative_url }}"></script>
</body>
</html>
