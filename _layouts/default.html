<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    {% seo %}

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Patrick+Hand&display=swap">

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body data-theme="dark">
    <div class="paper" style="position:relative;min-height:100vh;overflow:hidden">
        <!-- Cursor spotlight -->
        <div id="spotlight" style="position:fixed;left:0;top:0;width:520px;height:520px;pointer-events:none;z-index:0;background:radial-gradient(circle,color-mix(in srgb,var(--color-accent) 16%,transparent),transparent 62%)"></div>

        <!-- Punch holes decoration -->
        <div class="d-only punch" style="top:150px"></div>
        <div class="d-only punch" style="top:420px"></div>
        <div class="d-only punch" style="top:690px"></div>

        <div style="position:relative;z-index:1">
            {% include header.html %}

            <main class="main-content">
                {{ content }}
            </main>

            {% include footer.html %}
        </div>
    </div>

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/dark-mode.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/navbar.js' | relative_url }}"></script>
</body>
</html>
