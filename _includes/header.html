<header class="site-header">
    <div class="header-content">
        <a href="{{ '/' | relative_url }}" class="site-branding">
            <span class="logo">TJ</span>
            <span class="site-title">{{ site.title }}</span>
        </a>

        <nav class="site-nav desktop-only">
            <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
            <a href="{{ '/tcf' | relative_url }}" {% if page.url contains '/tcf' %}class="active"{% endif %}>TCF</a>
            <a href="{{ '/french' | relative_url }}" {% if page.url contains '/french' %}class="active"{% endif %}>French</a>
            <a href="{{ '/blog' | relative_url }}" {% if page.url contains '/blog' %}class="active"{% endif %}>Blog</a>
            <a href="{{ '/about' | relative_url }}" {% if page.url == '/about/' %}class="active"{% endif %}>About</a>
        </nav>

        <div class="header-controls">
            <button class="lang-toggle" id="lang-toggle" aria-label="Toggle language">
                <span class="lang-en">EN</span>
                <span class="lang-fr">FR</span>
            </button>
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">☾</button>
            <button class="menu-toggle mobile-only" id="menu-toggle" aria-label="Menu">☰</button>
        </div>
    </div>

    <div class="mobile-nav" id="mobile-nav" style="display: none;">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <a href="{{ '/tcf' | relative_url }}" {% if page.url contains '/tcf' %}class="active"{% endif %}>TCF</a>
        <a href="{{ '/french' | relative_url }}" {% if page.url contains '/french' %}class="active"{% endif %}>French</a>
        <a href="{{ '/blog' | relative_url }}" {% if page.url contains '/blog' %}class="active"{% endif %}>Blog</a>
        <a href="{{ '/about' | relative_url }}" {% if page.url == '/about/' %}class="active"{% endif %}>About</a>
    </div>
</header>
